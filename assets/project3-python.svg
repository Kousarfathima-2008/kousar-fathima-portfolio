<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101932"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p3Bg)"/>

  <!-- Background decorative elements -->
  <circle cx="520" cy="90" r="90" fill="#6366f1" opacity="0.08"/>
  <circle cx="90" cy="270" r="100" fill="#a855f7" opacity="0.08"/>

  <!-- Terminal Window Mockup -->
  <rect x="55" y="45" width="490" height="270" rx="12" fill="url(#termGrad)" stroke="#232e4d" stroke-width="2"/>
  
  <!-- Terminal Top Bar -->
  <rect x="55" y="45" width="490" height="36" rx="12" fill="#17213d"/>
  <circle cx="80" cy="63" r="5" fill="#ef4444"/>
  <circle cx="97" cy="63" r="5" fill="#f59e0b"/>
  <circle cx="114" cy="63" r="5" fill="#10b981"/>
  
  <text x="300" y="68" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">terminal ~ python3 fundamentals.py</text>

  <!-- Python Code / Terminal Lines -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600">
    <text x="85" y="115" fill="#64748b"># Python Basics: First-Year CSE Fundamentals</text>
    
    <text x="85" y="142" fill="#38bdf8">def <tspan fill="#facc15">greet_student</tspan>(<tspan fill="#f43f5e">name</tspan>, <tspan fill="#f43f5e">branch</tspan>):</text>
    <text x="115" y="166" fill="#f8fafc">print(<tspan fill="#34d399">f"Welcome {name} to {branch}!"</tspan>)</text>
    
    <text x="85" y="196" fill="#38bdf8">skills <tspan fill="#cbd5e1">=</tspan> [<tspan fill="#34d399">"Logic"</tspan>, <tspan fill="#34d399">"Loops"</tspan>, <tspan fill="#34d399">"Functions"</tspan>, <tspan fill="#34d399">"Problem Solving"</tspan>]</text>
    
    <text x="85" y="226" fill="#38bdf8">for <tspan fill="#f8fafc">topic</tspan> in <tspan fill="#f8fafc">skills</tspan>:</text>
    <text x="115" y="250" fill="#f8fafc">print(<tspan fill="#34d399">f"Practicing: {topic}..."</tspan>)</text>
    
    <line x1="85" y1="268" x2="515" y2="268" stroke="#1f2c4c" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Output line -->
    <text x="85" y="292" fill="#a855f7">&gt;&gt;&gt; <tspan fill="#4ade80">Output:</tspan> <tspan fill="#e2e8f0">Building strong computer science foundations step by step.</tspan></text>
  </g>
</svg>

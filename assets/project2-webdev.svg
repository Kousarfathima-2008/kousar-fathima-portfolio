<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="60%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#0e1326"/>
    </linearGradient>
    <linearGradient id="codeBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18203c"/>
      <stop offset="100%" stop-color="#0f152a"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e44d26"/>
      <stop offset="100%" stop-color="#f16529"/>
    </linearGradient>
    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#264de4"/>
      <stop offset="100%" stop-color="#2965f1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p2Bg)"/>

  <!-- Background Decorative glowing circles -->
  <circle cx="100" cy="80" r="120" fill="#7c3aed" opacity="0.08"/>
  <circle cx="500" cy="280" r="100" fill="#38bdf8" opacity="0.06"/>

  <!-- Left Card: Code Editor Window -->
  <rect x="50" y="55" width="280" height="250" rx="12" fill="url(#codeBoxGrad)" stroke="#263152" stroke-width="2"/>
  
  <rect x="50" y="55" width="280" height="35" rx="12" fill="#1e284a"/>
  <!-- Tab circles -->
  <circle cx="70" cy="72" r="5" fill="#ef4444"/>
  <circle cx="85" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="72" r="5" fill="#10b981"/>
  <rect x="130" y="63" width="90" height="18" rx="4" fill="#0f162c"/>
  <text x="175" y="76" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">practice.html</text>

  <!-- Code lines -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600">
    <text x="75" y="115" fill="#e44d26">&lt;!DOCTYPE html&gt;</text>
    <text x="75" y="135" fill="#38bdf8">&lt;<tspan fill="#f43f5e">html</tspan> <tspan fill="#a855f7">lang</tspan>=<tspan fill="#34d399">"en"</tspan>&gt;</text>
    <text x="90" y="155" fill="#38bdf8">&lt;<tspan fill="#f43f5e">head</tspan>&gt;</text>
    <text x="105" y="175" fill="#38bdf8">&lt;<tspan fill="#f43f5e">title</tspan>&gt;<tspan fill="#f8fafc">My Web Page</tspan>&lt;/<tspan fill="#f43f5e">title</tspan>&gt;</text>
    <text x="105" y="195" fill="#38bdf8">&lt;<tspan fill="#f43f5e">link</tspan> <tspan fill="#a855f7">rel</tspan>=<tspan fill="#34d399">"stylesheet"</tspan>&gt;</text>
    <text x="90" y="215" fill="#38bdf8">&lt;/<tspan fill="#f43f5e">head</tspan>&gt;</text>
    <text x="90" y="235" fill="#38bdf8">&lt;<tspan fill="#f43f5e">body</tspan>&gt;</text>
    <text x="105" y="255" fill="#38bdf8">&lt;<tspan fill="#f43f5e">h1</tspan>&gt;<tspan fill="#c084fc">Hello World!</tspan>&lt;/<tspan fill="#f43f5e">h1</tspan>&gt;</text>
    <text x="90" y="275" fill="#38bdf8">&lt;/<tspan fill="#f43f5e">body</tspan>&gt;</text>
  </g>

  <!-- Right Side: Dual Badges and Visual Preview Cards -->
  <!-- HTML5 Badge -->
  <g transform="translate(360, 60)">
    <rect width="190" height="95" rx="10" fill="#141c33" stroke="#253255" stroke-width="1.5"/>
    <rect x="15" y="22" width="50" height="50" rx="10" fill="#201726" stroke="#e44d26" stroke-width="1.5"/>
    <text x="40" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#e44d26" text-anchor="middle">&lt;/&gt;</text>
    <text x="80" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">HTML5 Core</text>
    <text x="80" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Semantic structure,</text>
    <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">forms &amp; layout blocks</text>
  </g>

  <!-- CSS3 Badge -->
  <g transform="translate(360, 175)">
    <rect width="190" height="95" rx="10" fill="#141c33" stroke="#253255" stroke-width="1.5"/>
    <rect x="15" y="22" width="50" height="50" rx="10" fill="#161c36" stroke="#264de4" stroke-width="1.5"/>
    <text x="40" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#3b82f6" text-anchor="middle">#</text>
    <text x="80" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">CSS3 Styling</text>
    <text x="80" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Flexbox, grid system,</text>
    <text x="80" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">colors &amp; typography</text>
  </g>

  <!-- Status pill bottom -->
  <rect x="360" y="285" width="190" height="24" rx="12" fill="#1b1c38" stroke="#8b5cf6" stroke-width="1"/>
  <text x="455" y="301" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#d8b4fe" text-anchor="middle">Beginner Practice Projects</text>
</svg>

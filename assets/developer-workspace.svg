<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>

    <!-- Gradients for Tech Screens -->
    <linearGradient id="neonGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neonGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Cosmic Background -->
  <rect width="600" height="480" rx="16" fill="url(#cyberBg)"/>

  <!-- Starry Particle Dots -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="45" cy="50" r="1"/>
    <circle cx="110" cy="85" r="1.5" opacity="0.6"/>
    <circle cx="210" cy="35" r="1"/>
    <circle cx="340" cy="70" r="1.2"/>
    <circle cx="490" cy="45" r="1.5" opacity="0.7"/>
    <circle cx="550" cy="110" r="1"/>
    <circle cx="520" cy="380" r="1.2"/>
    <circle cx="80" cy="400" r="1"/>
    <circle cx="560" cy="270" r="1.5"/>
  </g>

  <!-- Isometric Perspective Floor Grid (Matches Reference 1) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="440" x2="600" y2="440"/>
    <line x1="120" y1="320" x2="30" y2="480"/>
    <line x1="240" y1="320" x2="190" y2="480"/>
    <line x1="360" y1="320" x2="370" y2="480"/>
    <line x1="480" y1="320" x2="550" y2="480"/>
  </g>

  <!-- Ambient Under-Desk Neon Glows (Cyan & Purple) -->
  <ellipse cx="300" cy="385" rx="230" ry="55" fill="#3b82f6" opacity="0.16" filter="url(#softGlow)"/>
  <ellipse cx="380" cy="370" rx="140" ry="40" fill="#a855f7" opacity="0.18" filter="url(#softGlow)"/>

  <!-- ==================== LEFT TOWER / HARDWARE UNIT ==================== -->
  <g transform="translate(60, 160)">
    <!-- Tower Body -->
    <rect x="0" y="0" width="85" height="175" rx="8" fill="#0b1222" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="6" y="6" width="73" height="163" rx="5" fill="#060b14"/>
    
    <!-- Neon Accent Stripe -->
    <line x1="14" y1="20" x2="14" y2="155" stroke="#06b6d4" stroke-width="2.5" filter="url(#glowCyan)"/>
    <line x1="20" y1="20" x2="20" y2="155" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>

    <!-- Status Indicator LEDs -->
    <circle cx="55" cy="30" r="3.5" fill="#10b981" filter="url(#glowCyan)"/>
    <circle cx="68" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="55" cy="44" r="3" fill="#a855f7"/>
    <circle cx="68" cy="44" r="3" fill="#f59e0b"/>

    <!-- Airflow Ventilation Grid -->
    <line x1="32" y1="70" x2="72" y2="70" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="80" x2="72" y2="80" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="90" x2="72" y2="90" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="100" x2="72" y2="100" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="110" x2="72" y2="110" stroke="#1e293b" stroke-width="2"/>
    <line x1="32" y1="120" x2="72" y2="120" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Optical Glow Port -->
    <circle cx="52" cy="148" r="8" fill="#0c162d" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="52" cy="148" r="3" fill="#38bdf8" filter="url(#glowCyan)"/>
  </g>

  <!-- ==================== CENTER MAIN MONITOR (AI NEURAL MESH & COMPUTER DISPLAY) ==================== -->
  <g transform="translate(155, 65)">
    <!-- Monitor Frame with Cyan/Blue Neon Border -->
    <rect x="0" y="0" width="260" height="185" rx="8" fill="#0b1222" stroke="url(#neonGradient1)" stroke-width="2" filter="url(#glowCyan)"/>
    <rect x="0" y="0" width="260" height="185" rx="8" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Screen Bezel Header -->
    <rect x="0" y="0" width="260" height="22" rx="8" fill="#0f172a"/>
    <circle cx="16" cy="11" r="3.5" fill="#ef4444" opacity="0.9"/>
    <circle cx="28" cy="11" r="3.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="40" cy="11" r="3.5" fill="#10b981" opacity="0.9"/>

    <!-- Display Screen Glass Area -->
    <rect x="6" y="22" width="248" height="157" fill="url(#screenGlass)"/>

    <!-- AI Neural Network Nodes & Cybernetic Constellation Inside Screen -->
    <g opacity="0.85">
      <!-- Neural Connection Lines -->
      <path d="M 40 60 L 90 95 L 155 70 L 210 100 L 175 145 L 105 135 L 40 60 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.5"/>
      <path d="M 90 95 L 130 115 L 175 145" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
      <path d="M 155 70 L 130 115 L 105 135" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.6"/>

      <!-- Glowing AI Core Brain / Neural Nodes -->
      <circle cx="130" cy="115" r="9" fill="#0e1b38" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="130" cy="115" r="4" fill="#38bdf8"/>

      <circle cx="90" cy="95" r="6" fill="#1e1035" stroke="#c084fc" stroke-width="1.8"/>
      <circle cx="90" cy="95" r="2.5" fill="#e879f9"/>

      <circle cx="155" cy="70" r="5" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="155" cy="70" r="2" fill="#7dd3fc"/>

      <circle cx="40" cy="60" r="4.5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="210" cy="100" r="5" fill="#082f49" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="175" cy="145" r="5" fill="#1e1035" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="105" cy="135" r="4.5" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Futuristic Waveform / Audio-Data Spectrum at Screen Bottom -->
      <g transform="translate(25, 148)" opacity="0.75">
        <rect x="0" y="8" width="3" height="12" rx="1.5" fill="#06b6d4"/>
        <rect x="6" y="4" width="3" height="16" rx="1.5" fill="#38bdf8"/>
        <rect x="12" y="10" width="3" height="10" rx="1.5" fill="#818cf8"/>
        <rect x="18" y="2" width="3" height="18" rx="1.5" fill="#a855f7"/>
        <rect x="24" y="6" width="3" height="14" rx="1.5" fill="#c084fc"/>
        <rect x="30" y="11" width="3" height="9" rx="1.5" fill="#38bdf8"/>
        <rect x="36" y="5" width="3" height="15" rx="1.5" fill="#06b6d4"/>
      </g>
    </g>

    <!-- Monitor Ergonomic Stand -->
    <path d="M 115 185 L 105 235 L 155 235 L 145 185 Z" fill="#111827"/>
    <rect x="85" y="235" width="90" height="8" rx="4" fill="#1e293b"/>
  </g>

  <!-- ==================== RIGHT VERTICAL SECONDARY DISPLAY (CODE & UI) ==================== -->
  <g transform="translate(430, 95)">
    <!-- Vertical Frame with Purple Glow -->
    <rect x="0" y="0" width="125" height="210" rx="8" fill="#0b1222" stroke="url(#neonGradient2)" stroke-width="1.8" filter="url(#glowPurple)"/>
    <rect x="0" y="0" width="125" height="210" rx="8" fill="#070c18" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Screen Bezel Header -->
    <rect x="0" y="0" width="125" height="18" rx="8" fill="#13112c"/>
    <circle cx="12" cy="9" r="2.5" fill="#ef4444"/>
    <circle cx="20" cy="9" r="2.5" fill="#f59e0b"/>
    <circle cx="28" cy="9" r="2.5" fill="#10b981"/>

    <!-- Code Block Lines -->
    <g transform="translate(12, 32)" opacity="0.85">
      <rect x="0" y="0" width="45" height="4" rx="2" fill="#f43f5e"/>
      <rect x="0" y="12" width="70" height="4" rx="2" fill="#38bdf8"/>
      <rect x="10" y="24" width="85" height="4" rx="2" fill="#c084fc"/>
      <rect x="18" y="36" width="60" height="4" rx="2" fill="#34d399"/>
      <rect x="10" y="48" width="40" height="4" rx="2" fill="#c084fc"/>
      <rect x="0" y="64" width="75" height="4" rx="2" fill="#facc15"/>
      <rect x="10" y="76" width="95" height="4" rx="2" fill="#38bdf8"/>
      <rect x="10" y="88" width="65" height="4" rx="2" fill="#a855f7"/>
      <rect x="18" y="100" width="50" height="4" rx="2" fill="#34d399"/>
      <rect x="10" y="112" width="70" height="4" rx="2" fill="#38bdf8"/>
      <rect x="0" y="128" width="55" height="4" rx="2" fill="#facc15"/>
      <rect x="0" y="144" width="80" height="4" rx="2" fill="#38bdf8"/>
      <rect x="10" y="156" width="60" height="4" rx="2" fill="#34d399"/>
    </g>

    <!-- Stand -->
    <path d="M 52 210 L 48 240 L 78 240 L 74 210 Z" fill="#13112c"/>
    <rect x="38" y="240" width="50" height="6" rx="3" fill="#1e1b4b"/>
  </g>

  <!-- ==================== DESKTOP ACCESSORIES: RGB KEYBOARD & ERGONOMIC MOUSE ==================== -->
  <g transform="translate(195, 315)">
    <!-- Keyboard Deck with Purple Neon Underglow -->
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#0d1527" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glowPurple)"/>
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Key Rows Representation with RGB Glow Lines -->
    <line x1="10" y1="11" x2="170" y2="11" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="9 3" opacity="0.9"/>
    <line x1="10" y1="20" x2="170" y2="20" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="9 3" opacity="0.9"/>
    <line x1="10" y1="29" x2="170" y2="29" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="9 3" opacity="0.9"/>
    <rect x="52" y="36" width="76" height="5" rx="2.5" fill="#e879f9" opacity="0.9"/>

    <!-- Mouse Mat & Wireless Mouse -->
    <g transform="translate(198, 5)">
      <rect x="0" y="0" width="46" height="40" rx="4" fill="#090f1d" stroke="#1e293b" stroke-width="1"/>
      <!-- Mouse Body -->
      <rect x="12" y="4" width="22" height="32" rx="10" fill="#0c162c" stroke="#06b6d4" stroke-width="1.2" filter="url(#glowCyan)"/>
      <line x1="23" y1="8" x2="23" y2="17" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Ambient Holographic Floating Circles (Matches Lovable Style) -->
  <circle cx="530" cy="390" r="18" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="530" cy="390" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
</svg>

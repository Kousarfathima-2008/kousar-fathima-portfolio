<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="50%" stop-color="#181938"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p1Bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Browser Mockup Window -->
  <rect x="70" y="45" width="460" height="270" rx="12" fill="#11182c" stroke="#2a3250" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M 70 57 C 70 50, 75 45, 82 45 L 518 45 C 525 45, 530 50, 530 57 L 530 85 L 70 85 Z" fill="#171f38" stroke="#2a3250" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="95" cy="65" r="5" fill="#ef4444"/>
  <circle cx="112" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="65" r="5" fill="#10b981"/>

  <!-- Browser address bar -->
  <rect x="155" y="55" width="280" height="20" rx="6" fill="#0d1425" stroke="#242c46" stroke-width="1"/>
  <text x="295" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">kausarfatima.dev/portfolio</text>

  <!-- Hero Content Representation inside Mockup -->
  <!-- Monogram Logo in Mockup -->
  <rect x="100" y="105" width="30" height="20" rx="4" fill="url(#p1Accent)"/>
  <text x="115" y="119" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">KF</text>
  
  <!-- Mockup nav links -->
  <rect x="360" y="112" width="28" height="6" rx="3" fill="#64748b"/>
  <rect x="400" y="112" width="28" height="6" rx="3" fill="#64748b"/>
  <rect x="440" y="112" width="32" height="6" rx="3" fill="#a855f7"/>

  <!-- Left Intro Hero Column -->
  <rect x="100" y="150" width="130" height="12" rx="4" fill="#f8fafc"/>
  <rect x="100" y="170" width="180" height="8" rx="4" fill="#a855f7"/>
  <rect x="100" y="190" width="190" height="6" rx="3" fill="#64748b"/>
  <rect x="100" y="202" width="160" height="6" rx="3" fill="#64748b"/>

  <!-- Mockup action button -->
  <rect x="100" y="225" width="75" height="24" rx="6" fill="url(#p1Accent)"/>
  <text x="137" y="240" font-family="sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">EXPLORE</text>

  <rect x="185" y="225" width="75" height="24" rx="6" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="222" y="240" font-family="sans-serif" font-weight="bold" font-size="8" fill="#c084fc" text-anchor="middle">CONTACT</text>

  <!-- Right Avatar Graphic Mockup -->
  <circle cx="380" cy="195" r="42" fill="#1e183a" stroke="url(#p1Accent)" stroke-width="2"/>
  <circle cx="380" cy="180" r="16" fill="#6d28d9"/>
  <path d="M 355 225 C 355 205, 365 200, 380 200 C 395 200, 405 205, 405 225 Z" fill="#4c1d95"/>
  
  <!-- Subtle Badge -->
  <rect x="440" y="270" width="70" height="20" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="475" y="283" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#e9d5ff" text-anchor="middle">HTML + CSS</text>
</svg>
